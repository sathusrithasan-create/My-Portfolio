    <style>

        :root {

            --bg: #faf8f6;
            --surface: #fff;
            --surface-2: #f5f2ef;
            --fg: #2b2124;

        }
        .lang-ta,

        /* ─── HEADER ─── */

        /* ─── SCALE REF ─── */
        .scale-grid {

            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));

            font-size: 18px;
            font-weight: 800;

        .scale-item .range {

            color: var(--muted);

            font-size: 13px;
        }
        .scale-item.fail {

            margin-top: 10px;

        .note a {

        .spinner {

            border-top-color: var(--maroon);

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo, useCallback } = React;

        /* ================================================================
           DATA
           ================================================================ */

        function scoreToGPA(s) {
            if (s >= 90) return { point: 4.0, letter: 'A+', pass: true };
            if (s >= 80) return { point: 3.7, letter: 'A', pass: true };
            if (s >= 70) return { point: 3.3, letter: 'B+', pass: true };
            if (s >= 60) return { point: 3.0, letter: 'B', pass: true };
            if (s >= 50) return { point: 2.7, letter: 'C', pass: true };
            if (s >= 40) return { point: 2.0, letter: 'S', pass: true };
            return { point: 0, letter: 'F', pass: false };
        }

        function classify(g, lang) {
            if (g >= 3.7) return lang === 'en' ? 'First Class Distinction' : 'முதல் வகுப்பு சிறப்பு';
            if (g >= 3.3) return lang === 'en' ? 'Second Class Upper' : 'இரண்டாம் வகுப்பு மேல்';
            if (g >= 3.0) return lang === 'en' ? 'Second Class Lower' : 'இரண்டாம் வகுப்பு கீழ்';
            if (g >= 2.7) return lang === 'en' ? 'General Pass (Merit)' : 'பொதுத் தேர்ச்சி (தகுதி)';
            if (g >= 2.0) return lang === 'en' ? 'General Pass' : 'பொதுத் தேர்ச்சி';
            return lang === 'en' ? 'Not Passed' : 'தேர்ச்சி பெறவில்லை';

        /* ================================================================

        function generateResultPDF(p) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'pt', format: 'a4' });
            const W = doc.internal.pageSize.getWidth();
            const MAROON = [114, 24, 36];
            const GREY = [55, 65, 81];
            const LIGHT = [243, 244, 246];

            // Header
            doc.setFillColor(...MAROON);
            doc.rect(0, 0, W, 90, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(20);
            doc.text('Student GPA Report', W / 2, 38, { align: 'center' });
            doc.setFontSize(11);
            doc.setFont('helvetica', 'normal');
            
            doc.setFontSize(9);
            doc.text('New Education Reform System (Grade 6–13)', W / 2, 74, { align: 'center' });

            let y = 115;
            doc.setTextColor(...GREY);
            doc.setFontSize(11);
            doc.setFont('helvetica', 'bold');
            doc.text('Student Details', 40, y);
            doc.setDrawColor(...MAROON);
            doc.setLineWidth(1);
            doc.line(40, y + 4, W - 40, y + 4);

            y += 22;
            const info = [
                ['Name', p.studentName || '-'],
                ['Index No.', p.indexNo || '-'],
                ['School', p.school || '-'],
                ['Province', p.province || '-'],
                ['District', p.district || '-'],
                ['Zone', p.zone || '-'],
                ['Division', p.division || '-'],
                ['Grade', p.grade],
            ];
            if (p.streamOrTrack) info.push(['Stream', p.streamOrTrack]);

            doc.setFontSize(10);
            const col2X = W / 2 + 10;
            info.forEach((pair, i) => {
                const x = i % 2 === 0 ? 40 : col2X,
                    row = Math.floor(i / 2);
                doc.setFont('helvetica', 'bold');
                doc.text(pair[0] + ':', x, y + row * 16);
                doc.setFont('helvetica', 'normal');
                doc.text(String(pair[1]), x + 80, y + row * 16);
            });
            y += Math.ceil(info.length / 2) * 16 + 15;

            // Subject table
            doc.autoTable({
                startY: y,
                head: [
                    ['#', 'Subject', 'Credit', 'Score (%)', 'GPA', 'Grade', 'Status']
                ],
                body: p.rows.map((r, i) => [i + 1, r.subject, r.credit, r.score === '' ? '-' : String(r.score), r.gpa
                    .toFixed(2), r.letter, r.status
                ]),
                theme: 'grid',
                headStyles: { fillColor: MAROON, textColor: 255, fontStyle: 'bold', halign: 'center' },
                bodyStyles: { textColor: GREY, fontSize: 9 },
                alternateRowStyles: { fillColor: LIGHT },
                columnStyles: {
                    0: { halign: 'center', cellWidth: 28 },
                    2: { halign: 'center', cellWidth: 45 },
                    3: { halign: 'center', cellWidth: 60 },
                    4: { halign: 'center', cellWidth: 45 },
                    5: { halign: 'center', cellWidth: 45 },
                    6: { halign: 'center', cellWidth: 55 }
                },
                didParseCell: (data) => {
                    if (data.section === 'body' && data.column.index === 6) {
                        const v = String(data.cell.raw).toUpperCase();
                        data.cell.styles.fontStyle = 'bold';
                        data.cell.styles.textColor = v.includes('FAIL') || String(data.cell.raw).includes('தோல்வி') ?
                            [178, 34, 34] : [21, 128, 61];
                    }
                },
                margin: { left: 40, right: 40 },
            });

            const finalY = doc.lastAutoTable.finalY + 25;
            doc.setFillColor(...MAROON);
            doc.roundedRect(40, finalY, W - 80, 90, 8, 8, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(12);
            doc.text('OVERALL GPA', 60, finalY + 28);
            doc.setFontSize(36);
            doc.text(p.overallGPA.toFixed(2), 60, finalY + 68);
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.text('Total Credits: ' + p.totalCredits, W - 60, finalY + 28, { align: 'right' });
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(12);
            doc.text(p.classification, W - 60, finalY + 55, { align: 'right' });
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);
            doc.text('Scale: 4.00 (A+ ≥90 – A ≥80 – B+ ≥70 – B ≥60 – C ≥50 – S ≥40 – F <40)', W - 60, finalY + 75,
            { align: 'right' });

            doc.setTextColor(...GREY);
            doc.setFontSize(8);
            doc.text('Generated: ' + p.generatedAt, 40, 820);
            doc.text('This is a computer-generated report.', W - 40, 820, { align: 'right' });
            doc.save('GPA_Report_' + (p.studentName || 'student').replace(/\s+/g, '_') + '.pdf');
        }

        function App() {
            const [lang, setLang] = useState('en');
            const [grade, setGrade] = useState(10);
            const [stream, setStream] = useState('science');
            const [electives, setElectives] = useState([]);
            const [scores, setScores] = useState({});
            const [showResults, setShowResults] = useState(false);

            const [student, setStudent] = useState({
                name: '',
                indexNo: '',
                province: '',
                district: '',
                zone: '',
                division: '',
                school: '',
            });

            const [schools, setSchools] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            const Lk = k => L(k, lang);

            useEffect(() => {
                let alive = true;
                setLoading(true);
                loadSchools()
                    .then(d => { if (alive) { setSchools(d);
                            setError(null); } })
                    .catch(e => { if (alive) setError(e.message); })
                    .finally(() => { if (alive) setLoading(false); });
                return () => { alive = false; };
            }, []);

            const provinces = useMemo(() => schools ? uniqueSorted(schools.map(s => s.PROVINCE)) : [], [schools]);
            const districts = useMemo(() =>
                schools && student.province ? uniqueSorted(schools.filter(s => s.PROVINCE === student.province).map(
                    s => s.DISTRICT)) : [],
                [schools, student.province]
            );
            const zones = useMemo(() =>
                schools && student.district ? uniqueSorted(schools.filter(s => s.DISTRICT === student.district).map(
                    s => s.EDU_ZONE)) : [],
                [schools, student.district]
            );
            const divisions = useMemo(() =>
                schools && student.zone ? uniqueSorted(schools.filter(s => s.EDU_ZONE === student.zone).map(s => s
                    .EDU_DIVISION)) : [],
                [schools, student.zone]
            );
            const schoolNames = useMemo(() => {
                if (!schools) return [];
                const scoped = schools.filter(s => {
                    if (student.division) return s.EDU_DIVISION === student.division;
                    if (student.zone) return s.EDU_ZONE === student.zone;
                    if (student.district) return s.DISTRICT === student.district;
                    if (student.province) return s.PROVINCE === student.province;
                    return false;
                });
                return uniqueSorted(scoped.map(s => s.SCHOOL_NAME));
            }, [schools, student.province, student.district, student.zone, student.division]);

            const subjects = useMemo(() =>
                getSubjectsForGrade(grade, { electives, stream }), [grade, electives, stream]
            );

            const results = useMemo(() => {
                let totalCredits = 0,
                    weighted = 0;
                const rows = subjects.map(s => {
                    const raw = scores[s.id];
                    const n = raw === undefined || raw === '' ? NaN : Math.max(0, Math.min(100, Number(raw)));
                    const has = !Number.isNaN(n);
                    const g = has ? scoreToGPA(n) : { point: 0, letter: '-', pass: false };
                    if (has) { totalCredits += s.credits;
                        weighted += g.point * s.credits; }
                    return {
                        id: s.id,
                        name: lang === 'en' ? s.en : s.ta,
                        credits: s.credits,
                        score: has ? n : '',
                        gpa: g.point,
                        letter: g.letter,
                        pass: g.pass,
                        has,
                    };
                });
                const overall = totalCredits > 0 ? weighted / totalCredits : 0;
                return { rows, totalCredits, overall };
            }, [subjects, scores, lang]);

            const toggleElective = id => {
                setElectives(prev => {
                    if (prev.includes(id)) return prev.filter(x => x !== id);
                    if (prev.length >= 2) return prev;
                    return [...prev, id];
                });
            };

            const updateStudent = (patch) => setStudent(s => ({ ...s, ...patch }));

            const resetAll = () => {
                setScores({});
                setShowResults(false);
                setElectives([]);
            };

            const handleDownload = () => {
                const streamName = (grade === 12 || grade === 13) ? (STREAMS.find(s => s.id === stream) || {})[
                lang] : '';
                generateResultPDF({
                    studentName: student.name,
                    indexNo: student.indexNo,
                    school: student.school,
                    province: clean(student.province),
                    district: clean(student.district),
                    zone: student.zone,
                    division: student.division,
                    grade: Lk('grade') + ' ' + grade,
                    streamOrTrack: streamName,
                    rows: results.rows.map(r => ({
                        subject: r.name,
                        credit: r.credits,
                        score: r.score,
                        gpa: r.gpa,
                        letter: r.letter,
                        status: r.has ? (r.pass ? Lk('pass') : Lk('fail')) : '-',
                    })),
                    totalCredits: results.totalCredits,
                    overallGPA: results.overall,
                    classification: classify(results.overall, lang),
                    generatedAt: new Date().toLocaleString('en-GB'),
                });
            };

            const handlePrint = () => {
                window.print();
            };

            return ( <
                    div className = { lang === 'ta' ? 'lang-ta' : '' } >
                    <
                    header >
                    <
                    div className = "wrap" >
                    <
                    div className = "brand" >
                    <
                    div className = "brand-icon" > 🎓 < /div> <
                    div >
                    <
                    h1 > { Lk('title') } < /h1> <
                    p > { Lk('subtitle') } < /p> <
                    
                    /div> <
                    /div> <
                    button className = "lang-btn no-print"

                        () => setLang(lang === 'en' ? 'ta' : 'en') } >
                    🌐 { Lk('language') } <
                    /button> <
                    /div> <
                    /header>

                    <
                    main className = "wrap" >
                    <
                    div className = "card" >
                    <
                    h2 > < span className = "accent-line" > < /span> {Lk('student')} < /h2> <
                    div className = "grid" >
                    <
                    div >
                    <
                    label > { Lk('name') } < /label> <
                    input value = { student.name }
                    onChange = { e => updateStudent({ name: e.target.value }) }
                    placeholder = { Lk('name') }
                    /> <
                    /div> <
                    div >
                    <
                    label > { Lk('indexNo') } < /label> <
                    input value = { student.indexNo }
                    onChange = { e => updateStudent({ indexNo: e.target.value }) }
                    placeholder = { Lk('indexNo') }
                    /> <
                    /div> <
                    div >
                    <
                    label > { Lk('province') } < /label> <
                    select value = { student.province }
                    disabled = { !schools }
                    onChange = { e => updateStudent({ province: e.target.value, district: '', zone: '', division: '',
                            school: '' }) } >
                    <
                    option value = "" > { Lk('selectPlaceholder') } < /option> {provinces.map(p => < option key = { p }
                    value = { p } > { clean(p) } < /option>)} <
                    /select> <
                    /div> <
                    div >
                    <
                    label > { Lk('district') } < /label> <
                    select value = { student.district }
                    disabled = { !student.province }
                    onChange = { e => updateStudent({ district: e.target.value, zone: '', division: '', school: '' }) } >
                    <
                    option value = "" > { Lk('selectPlaceholder') } < /option> {districts.map(d => < option key = { d }
                    value = { d } > { clean(d) } < /option>)} <
                    /select> <
                    /div> <

                    <
                    label > { Lk('zone') } < /label> <
                    select value = { student.zone }
                    disabled = { !student.district }
                    onChange = { e => updateStudent({ zone: e.target.value, division: '', school: '' }) } >
                    <
                    option value = "" > { Lk('selectPlaceholder') } < /option> {zones.map(z => < option key = { z }
                    value = { z } > { z } < /option>)} <

                    /div> <

                    <

                        loading && < p className = "note" > ⏳ { Lk('loadingSchools') } < /p>} {
                            error && < p className = "note"
                            style = { { color: 'var(--bad)' } } > ⚠ { Lk('schoolsError') } < /p>} {
                                schools && < p className = "note" >
                                { Lk('schoolFinder') } { ' ' } <
                                a href = "https://www.guruwaraya.lk/2026/03/sri-lanka-school-details-search-tool.html?m=1"
                                target = "_blank"
                                rel = "noreferrer" >
                                guruwaraya.lk ↗ <
                                /a> <
                                /p>} <
                                /div>

                                <
                                div className = "card" >
                                <
                                h2 > < span className = "accent-line" > < /span> {Lk('grade')} & amp; {lang === 'en' ? 'Curriculum' : 'பாடத்திட்டம்'} < /h2> <
                                div className = "grade-tabs" > { [6, 7, 8, 9, 10, 11, 12, 13].map(g => ( <
                                        button key = { g }
                                        className = { 'grade-tab' + (grade === g ? ' active' : '') }
                                        onClick = {
                                            () => { setGrade(g);
                                                setElectives([]);
                                                setScores({});
                                                setShowResults(false); } } >
                                        { Lk('grade') } { g } <
                                        /button>
                                    )) } <
                                    /div> {
                                        (grade === 10 || grade === 11) && ( <
                                            div style = { { marginTop: 12 } } >
                                            <
                                            p style = { { fontWeight: 600, fontSize: 14, marginBottom: 8 } } >
                                            { Lk('electives') } ({electives.length}/2) <
                                            /p> <
                                            div className = "chips" > { P1_ELECTIVES.map(e => {
                                                    const active = electives.includes(e.id);
                                                    const disabled = !active && electives.length >= 2;
                                                    return ( <
                                                        span key = { e.id }
                                                        className = { 'chip' + (active ? ' on' : '') + (disabled ?
                                                            ' off' : '') }
                                                        onClick = {
                                                            () => { if (!disabled) toggleElective(e.id); } } >
                                                        { lang === 'en' ? e.en : e.ta } <
                                                        span className = "cred" > { e.credits }
                                                        cr < /span> <
                                                        /span>
                                                    );
                                                }) } <
                                                /div> <
                                                /div>
                                            )
                                    } {
                                        (grade === 12 || grade === 13) && ( <
                                            div style = { { marginTop: 12 } } >
                                            <
                                            p style = { { fontWeight: 600, fontSize: 14, marginBottom: 8 } } >
                                            { Lk('stream') } <
                                            /p> <
                                            div className = "chips" > { STREAMS.map(s => ( <
                                                    span key = { s.id }
                                                    className = { 'chip' + (stream === s.id ? ' on' : '') }
                                                    onClick = {
                                                        () => { setStream(s.id);
                                                            setScores({});
                                                            setShowResults(false); } } >
                                                    { s[lang] } <
                                                    /span>
                                                )) } <
                                                /div> <
                                                /div>
                                            )
                                    } <
                                    /div>

                                    <
                                    div className = "card" >
                                    <
                                    h2 > < span className = "accent-line" > < /span> {Lk('subjects')} < /h2> <
                                    div className = "table-wrap" >
                                    <
                                    table >
                                    <
                                    thead >
                                    <
                                    tr >
                                    <
                                    th style = { { width: 40 } } > # < /th> <
                                    th > { Lk('subject') } < /th> <
                                    th className = "c" > { Lk('credit') } < /th> <
                                    th className = "c" > { Lk('score') } < /th> <
                                    th className = "c" > { Lk('gpa') } < /th> <
                                    th className = "c" > { Lk('grade_letter') } < /th> <
                                    th className = "c" > { Lk('status') } < /th> <
                                    /tr> <
                                    /thead> <
                                    tbody > { results.rows.map((r, i) => ( <
                                            tr key = { r.id } >
                                            <
                                            td className = "c" > { i + 1 } < /td> <
                                            td > { r.name } < /td> <
                                            td className = "c" > { r.credits } < /td> <
                                            td className = "c" >
                                            <
                                            input className = "score-input"
                                            type = "number"
                                            min = "0"
                                            max = "100"
                                            step = "0.01"
                                            value = { scores[r.id] ?? '' }
                                            onChange = { e => setScores(p => ({ ...p, [r.id]: e.target.value })) }
                                            placeholder = "0-100"
                                            /> <
                                            /td> <
                                            td className = "c" > { r.has ? r.gpa.toFixed(2) : '-' } < /td> <
                                            td className = "c" > < strong > { r.letter } < /strong></td >
                                            <
                                            td className = "c" > { r.has ? < span className = { r.pass ? 'pass' : 'fail' } >
                                                { r.pass ? Lk('pass') : Lk('fail') } < /span> : '-'} <
                                            /td> <
                                            /tr>
                                        )) } <
                                        /tbody> <
                                        /table> <
                                        /div> <
                                        div className = "actions no-print" >
                                        <
                                        button className = "btn btn-primary"
                                        onClick = {
                                            () => setShowResults(true) } >
                                        { Lk('calculate') } <
                                        /button> <
                                        button className = "btn btn-outline"
                                        onClick = { resetAll } >
                                        { Lk('reset') } <
                                        /button> <
                                        /div> <
                                        /div>

                                        {
                                            showResults && ( <
                                                div className = "card" >
                                                <
                                                h2 > < span className = "accent-line" > < /span> {Lk('results')} < /h2> <
                                                div className = "gpabox" >
                                                <
                                                div >
                                                <
                                                div className = "label" > { Lk('overall') } < /div> <
                                                div className = "big" > { results.overall.toFixed(2) } < /div> <
                                                div style = { { fontSize: 13, opacity: 0.8, marginTop: 4 } } >
                                                { Lk('totalCredits') }: { results.totalCredits } <
                                                /div> <
                                                /div> <
                                                div className = "right" >
                                                <
                                                div className = "classification" >
                                                { classify(results.overall, lang) } <
                                                /div> <
                                                div style = { { fontSize: 12, opacity: 0.7, marginTop: 4 } } >
                                                A + ≥90 • A ≥80 • B + ≥70 • B ≥60 • C ≥50 • S ≥40 • F & lt;40 <
                                                /div> <
                                                /div> <
                                                /div> <
                                                div className = "actions no-print actions-center" >
                                                <
                                                button className = "btn btn-gold"
                                                onClick = { handleDownload } >
                                                📄 { Lk('download') } <
                                                /button> <
                                                button className = "btn btn-primary"
                                                onClick = { handlePrint } >
                                                🖨 { Lk('print') } <
                                                /button> <
                                                /div> <
                                                p className = "note no-print" style = { { textAlign: 'center' } } >
                                                { Lk('printHint') } <
                                                /p> <
                                                /div>
                                            )
                                        }

                                        <
                                        div className = "card" >
                                        <
                                        h2 > < span className = "accent-line" > < /span> {Lk('scale')} < /h2> <
                                        div className = "scale-grid" > {
                                            [
                                                ['90–100%', 'A+', '4.0'],
                                                ['80–89%', 'A', '3.7'],
                                                ['70–79%', 'B+', '3.3'],
                                                ['60–69%', 'B', '3.0'],
                                                ['50–59%', 'C', '2.7'],
                                                ['40–49%', 'S', '2.0'],
                                                ['< 40%', 'F', '0.0'],
                                            ].map(([range, letter, pt]) => ( <
                                                div key = { letter }
                                                className = { 'scale-item' + (letter === 'F' ? ' fail' : '') } >
                                                <
                                                div className = "letter" > { letter } < /div> <
                                                div className = "range" > { range } < /div> <
                                                div className = "pt" > { pt } < /div> <
                                                /div>
                                            ))
                                        } <
                                        /div> <
                                        /div>

                                        <
                                        footer >
                                        Student GPA Calculator • { Lk('schoolFinder') } { ' ' } <
                                        a href = "https://www.guruwaraya.lk/2026/03/sri-lanka-school-details-search-tool.html?m=1"
                                        target = "_blank"
                                        rel = "noreferrer" > guruwaraya.lk < /a> •
                                        { ' ' } { new Date().getFullYear() } <
                                        /footer> <
                                        /main> <
                                        /div>
                                    );
                                }

                                ReactDOM.createRoot(document.getElementById('root')).render( < App / > );
    </script>
</body>
</html>
